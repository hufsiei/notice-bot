# 평일 9·13·17시(한국 시각)에 공지를 수집해 GitHub Pages로 배포한다.
name: 공지 업데이트

on:
  schedule:
    - cron: "0 0,4,8 * * 1-5"  # UTC 0·4·8시 = 한국 9·13·17시, 월~금
  workflow_dispatch:            # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: notice-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul            # 업데이트 시각·D-day를 한국 시각으로 계산
      PYTHONIOENCODING: utf-8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집한 공지 원문(data/)은 저장소에 올리지 않고 캐시로만 이어 쓴다
      - uses: actions/cache@v4
        with:
          path: data
          key: notices-${{ github.run_id }}
          restore-keys: notices-

      - run: python run.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
